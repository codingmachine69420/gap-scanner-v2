name: Gap Scan

# One capture per trading day, at 09:45:30 ET.
#
# Two crons, and only two. GitHub cron is UTC, so one entry lands on 08:35 ET
# in EDT and the other in EST; whichever is the wrong season for today exits
# on scan.py's guard or on its idempotency check once the other has pushed.
# There are deliberately no backup crons, no watchdog, and no retry. If a day
# is missed, it is missed.
#
# 08:35 rather than nearer the target because GitHub delivers `schedule`
# events late -- routinely 18-29 minutes even when healthy, and ~4 hours a day
# through 2026-08/09 (measured across two repos on this account). Starting
# 70 minutes early lets the sleep-to-target absorb an ordinary delay instead
# of blowing the capture. It absorbs nothing like 4 hours; that is what the
# external daily trigger is for, and why these crons are not the primary
# clock any more. When they do arrive on time they simply do the work first
# and the trigger's run skips.

on:
  schedule:
    - cron: "35 12 * * 1-5"    # 08:35 ET during EDT
    - cron: "35 13 * * 1-5"    # 08:35 ET during EST
  workflow_dispatch:
    inputs:
      force:
        # Default false so a manual run behaves exactly like a scheduled one:
        # guard, idempotency, then sleep to 09:45:30. Setting it true captures
        # at whatever time you dispatch, which the freshness assertion will
        # correctly call red outside the capture window -- correct bars that
        # arrive after the reader are still a miss.
        description: "Bypass the guard and the sleep-to-target (capture now)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gap-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Job starts ~08:35 ET and sleeps ~70 minutes to the capture instant.
    # scan.py's MAX_SLEEP_SECONDS (75 min) fails fast before this fires, so a
    # wait that cannot finish reports its own reason instead of being killed.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Capture
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
          MIN_GAP: "0.05"
          SCAN_STATUS_FILE: ${{ runner.temp }}/scan-status.json
        run: python scan.py

      - name: Commit
        run: |
          git config user.name  "gap-scanner[bot]"
          git config user.email "gap-scanner@users.noreply.github.com"
          # Both paths are absent on a fresh repo and on any skipped run, and
          # `git add` errors on a pathspec that matches nothing.
          for path in data universe.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "scan: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      # The whole reason this repo exists in its current form. A run that
      # produced no fresh data must go red -- unless scan.py recorded that it
      # skipped on purpose. See verify.py.
      - name: Assert freshness
        env:
          SCAN_STATUS_FILE: ${{ runner.temp }}/scan-status.json
        run: python verify.py
